# Saberes INTERSSAN — compila o app iOS (variante Prod → https://saberes.interssan.org) para o SIMULADOR, sem
# assinatura, num Mac da nuvem do GitHub. O .app sai como artefato e é enviado ao Appetize.io (iPhone virtual no
# navegador) a partir do Nitro5 — o token do Appetize não fica neste repositório.
name: Saberes iOS (simulador)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  simulador:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26.2*.app 2>/dev/null | head -1)
          [ -n "$X" ] || X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Dependências (CocoaPods)
        run: |
          pod --version 2>/dev/null | grep -qx 1.16.2 || sudo gem install cocoapods -v 1.16.2 --no-document
          pod install

      - name: Compilar para o simulador
        run: |
          set -o pipefail
          xcodebuild -workspace OpenEdX.xcworkspace -scheme OpenEdXProd -configuration DebugProd \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation -skipMacroValidation build > "$RUNNER_TEMP/xcodebuild.log" 2>&1 \
            || { grep -E '(error|warning): ' "$RUNNER_TEMP/xcodebuild.log" | grep -vE 'deployment target|Run script build phase|Copy Headers|duplicate build file' | sort -u | head -80; tail -40 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/xcodebuild.log"

      - name: Empacotar o .app
        run: |
          cd "$RUNNER_TEMP/dd/Build/Products/DebugProd-iphonesimulator"
          ls
          ditto -c -k --sequesterRsrc --keepParent "$(ls -d *.app | head -1)" "$GITHUB_WORKSPACE/Saberes-simulador.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: saberes-ios-simulador
          path: Saberes-simulador.zip
          retention-days: 14

      - name: Log da compilação (se falhar)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7
